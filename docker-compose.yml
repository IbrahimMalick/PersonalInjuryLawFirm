# Single multi-tenant deployment. `docker compose up -d`, then open
# http://localhost:3000 — firms sign up at /signup. Set DATABASE_URL in
# .env.local to use external Postgres; otherwise the embedded store
# persists to the /data volume.
services:
  nightshift:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    volumes:
      - nightshift-data:/data
    restart: unless-stopped

volumes:
  nightshift-data:
